name: docker-build-multiarch

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'input for docker version'
        required: true
        type: string
      name:
        description: 'input for container name'
        required: true
        type: string
        default: 'base'
      path:
        description: 'input to Dockerfile within docker/ folder such as: base/Dockerfile.alma'
        required: true
        type: string
        default: 'base/Dockerfile.alma'
      amd64_suffix:
        description: 'Suffix for AMD64 tag (default: -amd64)'
        required: false
        type: string
        default: '-amd64'
      arm64_suffix:
        description: 'Suffix for ARM64 tag (default: -arm64)'
        required: false
        type: string
        default: '-arm64'

env:
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build-amd64:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ inputs.path }}
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.name }}:${{ inputs.version }}${{ inputs.amd64_suffix }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ inputs.path }}
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.name }}:${{ inputs.version }}${{ inputs.arm64_suffix }}

  create-manifest:
    runs-on: ubuntu-22.04
    needs: [build-amd64, build-arm64]
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.name }}:${{ inputs.version }} \
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.name }}:${{ inputs.version }}${{ inputs.amd64_suffix }} \
            ${{ secrets.DOCKER_USERNAME }}/${{ inputs.name }}:${{ inputs.version }}${{ inputs.arm64_suffix }}
      -
        name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKER_USERNAME }}/${{ inputs.name }}:${{ inputs.version }}
